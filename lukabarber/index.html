h2{font-size:24px;color:var(--gold-l)}
.sub{color:var(--muted);font-size:14px;margin:2px 0 12px}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}

summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;min-height:60px}
summary::-webkit-details-marker{display:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.nm small{color:var(--muted);font-size:13px}
.pr{font:600 22px Fraunces,Georgia,serif;color:var(--gold);white-space:nowrap}
.chev{width:18px;height:18px;flex:0 0 18px;color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.body{padding:0 14px 14px;font-size:15px;color:#d9d1bd}
.body p{margin-bottom:8px}
.body ul{list-style:none;margin:4px 0 10px}
.body li{padding:5px 0 5px 22px;position:relative;border-top:1px solid #1f1b15}
.body li:first-child{border-top:0}
.body li:before{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.q{font-style:italic;color:var(--muted);font-size:14px}
.book{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;background:var(--wa);color:#06260f;font-weight:600;font-size:16px;text-decoration:none;border-radius:12px;min-height:50px}

const WA = '355684836487';
const T = {
  sq:{tag:'Çmimet dhe paketat', note:'Çmimet në euro · Rezervim në WhatsApp', t1:'Shërbimet', t2:'Paketat', t3:'Paketat e Eventeve', t5:'Kontakt',
      s1:'Prek një shërbim për detajet dhe rezervimin.', s2:'Çdo paketë shton më shumë kujdes. Prek për listën e plotë.', s3:'Për momente të veçanta, nga një mbrëmje deri te dasma.',
      s5:'Rezervo ose pyet direkt.', book:'Rezervo në WhatsApp', bookThis:'Rezervo këtë', inc:'Përfshin', min:'min',
      v1:'VIP', v2:'Analizë profesionale', v3:'Ekskluzive', foot:'© Luka Barber',
      wa:(n,p)=>`Përshëndetje Luka Barber. Dëshiroj të rezervoj: ${n} (${p}).`, waGen:'Përshëndetje Luka Barber. Dëshiroj të rezervoj një takim.'},
  en:{tag:'Prices and packages', note:'Prices in euro · Book on WhatsApp', t1:'Services', t2:'Packages', t3:'Event Packages', t5:'Contact',
      s1:'Tap a service for details and booking.', s2:'Each package adds more care. Tap for the full list.', s3:'For special moments, from an evening out to your wedding.',
      s5:'Book or ask directly.', book:'Book on WhatsApp', bookThis:'Book this', inc:'Includes', min:'min',
      v1:'VIP', v2:'Professional analysis', v3:'Exclusive', foot:'© Luka Barber',
      wa:(n,p)=>`Hello Luka Barber. I would like to book: ${n} (${p}).`, waGen:'Hello Luka Barber. I would like to book an appointment.'}
};
const VIP = {
  sq:{back:'Kjo është eksperienca më e plotë që ofron Luka Barber: të gjitha shërbimet dhe trajtimet (prerje, mjekër, larje, maskë fytyre, ngjyrim dhe masazh) të bashkuara në një takim të vetëm.',
      purpose:'Për klientët që nuk duan të zgjedhin mes shërbimeve: i duan të gjitha, me të njëjtin nivel vëmendjeje.'},
  en:{back:'The most complete experience Luka Barber offers: every service and treatment (haircut, beard, wash, face mask, coloring and massage) combined into a single visit.',
      purpose:'For clients who don\'t want to choose between services: they want it all, with the same level of attention.'}
};
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>';
const plain = s => { const d = document.createElement('div'); d.innerHTML = s; return d.textContent; };
const waLink = txt => `https://wa.me/${WA}?text=${encodeURIComponent(txt)}`;

function row(it, L, withItems){
  const d = it[L], t = T[L];
  let body = '';
  if (d.reason) body += `<p>${d.reason}</p>`;
  if (d.teaser) body += `<p>${d.teaser}</p>`;
  if (withItems && d.items) body += `<p><b>${t.inc}:</b></p><ul>${d.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if (d.quote) body += `<p class="q">“${d.quote}”</p>`;
  const sub = d.benefit ? `${it.duration} · ${d.benefit}` : `${it.duration}${d.items ? ` · ${d.items.length} ${L==='sq'?'trajtime':'treatments'}` : ''}`;
  return `<details><summary><span class="nm"><b>${d.name}</b><small>${sub}</small></span><span class="pr">${it.price}</span>${chev}</summary>
    <div class="body">${body}<a class="book" target="_blank" rel="noopener" href="${waLink(t.wa(plain(d.name), it.price))}">${waIcon}${t.bookThis} · ${it.price}</a></div></details>`;
}

function render(L){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(el => { const k = el.dataset.t; const v = T[L][k]; if (typeof v === 'string') el.textContent = v; });
  document.querySelector('[data-t="vback"]').textContent = VIP[L].back;
  document.querySelector('[data-t="vpurpose"]').textContent = VIP[L].purpose;
  document.getElementById('list-services').innerHTML = services.map(s => row(s, L, false)).join('');
  document.getElementById('list-packages').innerHTML = packages.map(s => row(s, L, true)).join('');
  document.getElementById('list-events').innerHTML = events.map(s => row(s, L, true)).join('');
  const vip = document.getElementById('vip-book');
  vip.href = waLink(T[L].wa('All Included', '80€')); vip.innerHTML = waIcon + T[L].bookThis + ' · 80€';
  const fab = document.getElementById('fab-book');
  fab.href = waLink(T[L].waGen); fab.innerHTML = waIcon + T[L].book;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
  try { localStorage.setItem('lb-lang', L); } catch (e) {}
}
let lang = 'sq';
try { lang = localStorage.getItem('lb-lang') || 'sq'; } catch (e) {}
render(lang);
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => render(b.dataset.l)));

// highlight the tab of the section on screen
const tabs = [...document.querySelectorAll('#tabs a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) tabs.forEach(a => {
    const on = a.getAttribute('href') === '#' + e.target.id;
    a.classList.toggle('on', on);
    if (on) { const c = a.parentElement; c.scrollTo({left: a.offsetLeft - c.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth'}); }
  });
}), {rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('main section').forEach(s => io.observe(s));
</script>
