<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luka Barber · Çmimet</title>
<meta name="description" content="Luka Barber: çmimet e shërbimeve dhe paketave. Rezervo në WhatsApp.">
<meta name="theme-color" content="#0a0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0908;--card:#14120f;--line:#2a251c;--gold:#d4af37;--gold-l:#f4e2a6;--text:#f4efe2;--muted:#a89a7c;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600}
/* header */
header{padding:22px 0 14px;text-align:center;background:radial-gradient(120% 80% at 50% 0%,#2a2111 0%,var(--bg) 70%)}
.top{display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:600 13px Inter,sans-serif;padding:7px 12px;min-height:34px}
.lang button.on{background:var(--gold);color:#0a0908}
h1{font-size:34px;letter-spacing:.14em;color:var(--gold);margin-top:6px}
.tag{color:var(--muted);font-size:15px;margin-top:2px}
.note{display:inline-block;margin-top:12px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
/* tabs */
nav{position:sticky;top:0;z-index:5;background:rgba(10,9,8,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:640px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;color:var(--text);text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;min-height:40px}
.tabs a.on{background:var(--gold);color:#0a0908;border-color:var(--gold)}
/* sections */
section{padding:22px 0 6px;scroll-margin-top:62px}
h2{font-size:24px;color:var(--gold-l)}
.sub{color:var(--muted);font-size:14px;margin:2px 0 12px}
/* rows */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details[open]{border-color:#5a4a22}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;min-height:60px}
summary::-webkit-details-marker{display:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.nm small{color:var(--muted);font-size:13px}
.pr{font:600 22px Fraunces,Georgia,serif;color:var(--gold);white-space:nowrap}
.chev{width:18px;height:18px;flex:0 0 18px;color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.body{padding:0 14px 14px;font-size:15px;color:#d9d1bd}
.body p{margin-bottom:8px}
.body ul{list-style:none;margin:4px 0 10px}
.body li{padding:5px 0 5px 22px;position:relative;border-top:1px solid #1f1b15}
.body li:first-child{border-top:0}
.body li:before{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.q{font-style:italic;color:var(--muted);font-size:14px}
.book{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;background:var(--wa);color:#06260f;font-weight:600;font-size:16px;text-decoration:none;border-radius:12px;min-height:50px}
.book svg{width:20px;height:20px}
/* special */
.vip{background:linear-gradient(160deg,#2b220f,#120f0a 60%);border:1px solid var(--gold);border-radius:18px;padding:20px;text-align:center}
.vip .badge{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.14em;color:#0a0908;background:var(--gold);border-radius:99px;padding:3px 10px}
.vip h3{font-size:28px;margin-top:10px}
.vip .big{font:600 44px Fraunces,Georgia,serif;color:var(--gold);line-height:1.1;margin:4px 0 8px}
.vip p{color:#d9d1bd;font-size:15px;margin-bottom:10px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}
.chips span{font-size:12px;border:1px solid #5a4a22;border-radius:99px;padding:4px 10px;color:var(--gold-l)}
/* contact */
.contact a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text);text-decoration:none;margin-bottom:8px;min-height:56px;font-weight:500}
.contact svg{width:22px;height:22px;color:var(--gold);flex:0 0 22px}
footer{color:var(--muted);text-align:center;font-size:13px;padding:24px 0 8px}
/* floating booking bar */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,rgba(10,9,8,0))}
.fab a{max-width:608px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><div class="lang" role="group" aria-label="Gjuha / Language"><button data-l="sq" class="on">SQ</button><button data-l="en">EN</button></div></div>
    <h1 class="serif">LUKA BARBER</h1>
    <p class="tag" data-t="tag"></p>
    <span class="note" data-t="note"></span>
  </div>
</header>
<nav><div class="tabs" id="tabs">
  <a href="#sherbimet" data-t="t1"></a><a href="#paketat" data-t="t2"></a><a href="#eventet" data-t="t3"></a><a href="#vip">VIP</a><a href="#kontakt" data-t="t5"></a>
</div></nav>
<main class="wrap">
  <section id="sherbimet"><h2 class="serif" data-t="t1"></h2><p class="sub" data-t="s1"></p><div id="list-services"></div></section>
  <section id="paketat"><h2 class="serif" data-t="t2"></h2><p class="sub" data-t="s2"></p><div id="list-packages"></div></section>
  <section id="eventet"><h2 class="serif" data-t="t3"></h2><p class="sub" data-t="s3"></p><div id="list-events"></div></section>
  <section id="vip">
    <div class="vip">
      <span class="badge">SPECIAL</span>
      <h3 class="serif">All Included</h3>
      <div class="big">80€</div>
      <div class="chips"><span data-t="v1"></span><span data-t="v2"></span><span data-t="v3"></span></div>
      <p data-t="vback"></p>
      <p data-t="vpurpose"></p>
      <a class="book" id="vip-book" target="_blank" rel="noopener"></a>
    </div>
  </section>
  <section id="kontakt" class="contact">
    <h2 class="serif" data-t="t5"></h2><p class="sub" data-t="s5"></p>
    <a href="https://wa.me/355684836487" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg><span>WhatsApp · +355 68 483 6487</span></a>
    <a href="https://www.instagram.com/barber_luka__" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg><span>Instagram · @barber_luka__</span></a>
    <a href="mailto:luka.shehu@icloud.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>luka.shehu@icloud.com</span></a>
  </section>
  <footer data-t="foot"></footer>
</main>
<div class="fab"><a class="book" id="fab-book" href="https://wa.me/355684836487" target="_blank" rel="noopener"></a></div>
<script>
/*DATA*/
const WA = '355684836487';
const T = {
  sq:{tag:'Çmimet dhe paketat', note:'Çmimet në euro · Rezervim në WhatsApp', t1:'Shërbimet', t2:'Paketat', t3:'Paketat e Eventeve', t5:'Kontakt',
      s1:'Prek një shërbim për detajet dhe rezervimin.', s2:'Çdo paketë shton më shumë kujdes. Prek për listën e plotë.', s3:'Për momente të veçanta, nga një mbrëmje deri te dasma.',
      s5:'Rezervo ose pyet direkt.', book:'Rezervo në WhatsApp', bookThis:'Rezervo këtë', inc:'Përfshin', min:'min',
      v1:'VIP', v2:'Analizë profesionale', v3:'Ekskluzive', foot:'© Luka Barber',
      wa:(n,p)=>`Përshëndetje Luka Barber. Dëshiroj të rezervoj: ${n} (${p}).`, waGen:'Përshëndetje Luka Barber. Dëshiroj të rezervoj një takim.'},
  en:{tag:'Prices and packages', note:'Prices in euro · Book on WhatsApp', t1:'Services', t2:'Packages', t3:'Event Packages', t5:'Contact',
      s1:'Tap a service for details and booking.', s2:'Each package adds more care. Tap for the full list.', s3:'For special moments, from an evening out to your wedding.',
      s5:'Book or ask directly.', book:'Book on WhatsApp', bookThis:'Book this', inc:'Includes', min:'min',
      v1:'VIP', v2:'Professional analysis', v3:'Exclusive', foot:'© Luka Barber',
      wa:(n,p)=>`Hello Luka Barber. I would like to book: ${n} (${p}).`, waGen:'Hello Luka Barber. I would like to book an appointment.'}
};
const VIP = {
  sq:{back:'Kjo është eksperienca më e plotë që ofron Luka Barber: të gjitha shërbimet dhe trajtimet (prerje, mjekër, larje, maskë fytyre, ngjyrim dhe masazh) të bashkuara në një takim të vetëm.',
      purpose:'Për klientët që nuk duan të zgjedhin mes shërbimeve: i duan të gjitha, me të njëjtin nivel vëmendjeje.'},
  en:{back:'The most complete experience Luka Barber offers: every service and treatment (haircut, beard, wash, face mask, coloring and massage) combined into a single visit.',
      purpose:'For clients who don\'t want to choose between services: they want it all, with the same level of attention.'}
};
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>';
const plain = s => { const d = document.createElement('div'); d.innerHTML = s; return d.textContent; };
const waLink = txt => `https://wa.me/${WA}?text=${encodeURIComponent(txt)}`;

function row(it, L, withItems){
  const d = it[L], t = T[L];
  let body = '';
  if (d.reason) body += `<p>${d.reason}</p>`;
  if (d.teaser) body += `<p>${d.teaser}</p>`;
  if (withItems && d.items) body += `<p><b>${t.inc}:</b></p><ul>${d.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if (d.quote) body += `<p class="q">“${d.quote}”</p>`;
  const sub = d.benefit ? `${it.duration} · ${d.benefit}` : `${it.duration}${d.items ? ` · ${d.items.length} ${L==='sq'?'trajtime':'treatments'}` : ''}`;
  return `<details><summary><span class="nm"><b>${d.name}</b><small>${sub}</small></span><span class="pr">${it.price}</span>${chev}</summary>
    <div class="body">${body}<a class="book" target="_blank" rel="noopener" href="${waLink(t.wa(plain(d.name), it.price))}">${waIcon}${t.bookThis} · ${it.price}</a></div></details>`;
}

function render(L){
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(el => { const k = el.dataset.t; const v = T[L][k]; if (typeof v === 'string') el.textContent = v; });
  document.querySelector('[data-t="vback"]').textContent = VIP[L].back;
  document.querySelector('[data-t="vpurpose"]').textContent = VIP[L].purpose;
  document.getElementById('list-services').innerHTML = services.map(s => row(s, L, false)).join('');
  document.getElementById('list-packages').innerHTML = packages.map(s => row(s, L, true)).join('');
  document.getElementById('list-events').innerHTML = events.map(s => row(s, L, true)).join('');
  const vip = document.getElementById('vip-book');
  vip.href = waLink(T[L].wa('All Included', '80€')); vip.innerHTML = waIcon + T[L].bookThis + ' · 80€';
  const fab = document.getElementById('fab-book');
  fab.href = waLink(T[L].waGen); fab.innerHTML = waIcon + T[L].book;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
  try { localStorage.setItem('lb-lang', L); } catch (e) {}
}
let lang = 'sq';
try { lang = localStorage.getItem('lb-lang') || 'sq'; } catch (e) {}
render(lang);
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => render(b.dataset.l)));

// highlight the tab of the section on screen
const tabs = [...document.querySelectorAll('#tabs a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) tabs.forEach(a => {
    const on = a.getAttribute('href') === '#' + e.target.id;
    a.classList.toggle('on', on);
    if (on) { const c = a.parentElement; c.scrollTo({left: a.offsetLeft - c.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth'}); }
  });
}), {rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('main section').forEach(s => io.observe(s));
</script>
</body>
</html>
